<html lang="ja">
<head>
<meta charset="utf-8">

<title>月額プランの解約｜AutoClicker｜CREATIVESITE</title>
<meta name="description" content="AutoClicker Pro版(月額)の解約手続きページ。">
<meta name="theme-color" content="#fdfdfd">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.creativesite.jp/autoclicker/manage/">
<style>
  :root {
    --paper: #fdfdfd;
    --ink: #111;
    --sub: #555;
    --rule: #dcdddd;
    --link: #1c3fd0;
    --gutter: clamp(1.25rem, 4.8vw, 6rem);
    --thin: "Helvetica Neue", "Segoe UI", "Avenir Next", Helvetica, Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
    --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--jp); line-height: 1.9; }
  a { color: var(--link); }
  .top { padding: 1.2rem var(--gutter); font-family: var(--thin); font-weight: 300; letter-spacing: .12em; text-transform: uppercase; font-size: .95rem; }
  .top a { color: var(--ink); text-decoration: none; }
  main { width: min(640px, 100% - 2.5rem); margin: 0 auto; padding: 1rem 0 5rem; }
  h1 { font-family: var(--thin); font-weight: 300; font-size: clamp(1.6rem, 4.5vw, 2.2rem); letter-spacing: .04em; }
  p.lead { color: var(--sub); max-width: 34em; }
  form { margin-top: 2rem; display: grid; gap: 1.2rem; }
  label { display: block; font-weight: 600; margin-bottom: .4rem; }
  input { width: 100%; font-family: inherit; font-size: 1rem; padding: .6rem .8rem; border: 1px solid var(--rule); }
  button { font-family: inherit; font-size: .95rem; padding: .7rem 1.6rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .status { margin-top: 1.2rem; padding: .9rem 1rem; border: 1px solid var(--rule); }
  .status.error { border-color: #b3261e; color: #b3261e; }
  .status.success { border-color: #1c7a3a; color: #1c7a3a; }
  .status[hidden] { display: none; }
</style>
</head>
<body>

<p class="top"><a href="/autoclicker/">&larr; AutoClicker</a></p>

<main>
  <h1>月額プランの解約</h1>
  <p class="lead">
    ライセンスキーと、ご購入時に登録されたメールアドレスを入力してください。
    解約後も、現在の請求サイクルの終わりまでは引き続きご利用いただけます。
  </p>

  <form id="cancel-form">
    <div>
      <label for="license-key">ライセンスキー</label>
      <input type="text" id="license-key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" required>
    </div>
    <div>
      <label for="customer-email">メールアドレス</label>
      <input type="email" id="customer-email" placeholder="ご購入時に登録したメールアドレス" autocomplete="email" required>
    </div>
    <div>
      <button type="submit" id="submit-btn">解約する</button>
    </div>
  </form>

  <p class="status" id="status" hidden></p>
</main>

<script>
(function () {
  var SUPABASE_URL = "https://xlkjvekoxaodfkmbeyej.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_Cx5jRWN41CB_34JM9XxlqQ_NkVeRV8g";

  var form = document.getElementById("cancel-form");
  var statusEl = document.getElementById("status");
  var submitBtn = document.getElementById("submit-btn");

  function showStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.hidden = false;
    statusEl.classList.remove("error", "success");
    if (kind) statusEl.classList.add(kind);
  }

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var licenseKey = document.getElementById("license-key").value.trim();
    var email = document.getElementById("customer-email").value.trim();
    if (!licenseKey || !email) return;

    if (!window.confirm("本当に解約しますか？現在の請求サイクルの終わりまではご利用いただけます。")) return;

    submitBtn.disabled = true;
    showStatus("処理しています…", null);

    try {
      var res = await fetch(SUPABASE_URL + "/functions/v1/cancel-subscription", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "apikey": SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ license_key: licenseKey, customer_email: email }),
      });
      var data = await res.json().catch(function () { return {}; });

      if (!data.ok) {
        showStatus(data.error || "処理に失敗しました。", "error");
        return;
      }
      showStatus(data.message || "解約を受け付けました。", "success");
      form.reset();
    } catch (err) {
      showStatus("通信に失敗しました。時間をおいて再度お試しください。", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
